name: test-email

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient email (default: SMTP_USER)"
        required: false
        default: ""

# One-off check that SMTP creds work — sends a test email.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send test email
        shell: bash
        env:
          TO: ${{ github.event.inputs.to }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          npm i nodemailer --no-save
          node .github/scripts/test-email.mjs
